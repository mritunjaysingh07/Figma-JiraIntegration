ai:
  max_tokens: 1000
  model: gpt-4o
  story_template: 'As a user, I want {component_name} to be implemented according
    to the design specifications

    so that the application maintains consistent design language and user experience.


    Design Details:

    {design_details}


    Acceptance Criteria:

    - Component matches Figma design exactly

    - Responsive behavior is implemented as specified

    - All interactions work as designed

    - Accessibility requirements are met

    - Component is reusable and properly documented

    '
  temperature: 0.7
figma:
  components_to_analyze:
  - FRAME
  - COMPONENT
  - COMPONENT_SET
  - INSTANCE
  - RECTANGLE
  - TEXT
  - VECTOR
  design_tokens:
  - colors
  - typography
  - spacing
  ignore_elements:
  - DOCUMENT
  - CANVAS
  rate_limit:
    calls_per_minute: 60
    min_delay: 1.0
io:
  input:
    local_file_path: ''
    mode: api
  output:
    file_format: json
    local_output_dir: output
    mode: jira
jira:
  fields:
    design_link: customfield_10017
    epic_link: customfield_10014
    story_points: customfield_10016
  issue_type: Story
  labels:
  - figma-import
  priority: Medium
  project_key: SCRUM
  status_mapping:
    done: Done
    in_progress: In Progress
    new: To Do
logging:
  backup_count: 5
  file: app.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  max_size: 10 MB
story:
  auto_assign: false
  component_types:
  - RECTANGLE
  - TEXT
  - VECTOR
  default_points: 3
  default_priority: Medium
  exclude_patterns:
  - _temp
  - _draft
  - _archive
  include_description: true
