# Logging configuration
logging:
  file: "app.log"
  max_size: "10 MB"
  backup_count: 3

# Jira configuration
jira:
  project_key: "SCRUM"
  url: "https://<username>.atlassian.net"
  email: "email-id"
  api_token: "<API Token>"
  fields:
    story_points: "customfield_10016"
    epic_link: "customfield_10014"
    epic_name: "customfield_10011"
    design_link: "customfield_10010"

# AI configurations
ai:
  model: "gpt-3.5-turbo"
  temperature: 0.7
  max_tokens: 2000
  openai_api_key: "API key"
  prompt_templates:
    story_analysis: "Analyze this design element and create a user story..."
    acceptance_criteria: "Generate acceptance criteria for..."
    technical_requirements: "Generate technical requirements for..."

# Figma configuration
figma:
  access_token: "<token>"
  # components_to_analyze:
  #   - "FRAME"
  #   - "COMPONENT"
  #   - "INSTANCE"
  #   - "TEXT"
  #   - "GROUP"
  rate_limit:
    calls_per_minute: 60
    min_delay: 1.0 
    
